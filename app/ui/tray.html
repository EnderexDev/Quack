<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quack</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="tray.js"></script>
</head>
<body class="traybody">
  <div class="tray chunk" id="tray">
    <div class="trayhead brand">
      <span class="mark"></span>
      <div class="who"><span class="word">Quack</span><span id="port"></span></div>
    </div>
    <div class="traylist" id="list"></div>
    <div class="trayfoot">
      <button class="btn yellow chunk-bright press" id="open" data-t="openWindow"></button>
      <button class="btn dark chunk press" id="pause"></button>
      <button class="btn dark chunk press" id="quit" data-t="quit"></button>
    </div>
  </div>
</body>
</html>
