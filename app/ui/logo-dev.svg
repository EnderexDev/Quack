  <!-- The official logo (Figma "Quack - Logo", page "★ Oficial", chosen 21/10/26): gold tile, black Fredoka Bold Q
       in medium relief with a metallic filete inside its edge. Drawn on a 512 grid, scaled into the 64 viewBox.
