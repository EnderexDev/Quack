[package]
name = "quack-app"
version = "1.0.0"
description = "Quack: the tray and window for the Quack hub"
edition = "2021"

[features]
# The build real games sync with (port 3825); without it, Quack Dev (3826)
official = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"], default-features = false }
# The approval token the app gives the hub it starts (32 random bytes from the OS)
getrandom = "0.2"

# The "Quack is waiting for your answer" toast, with a click that shows the window (the
# notification plugin's toast has no click on Windows)
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

# Dev builds (cargo build, tauri dev, cargo test): line numbers only for this crate, so panics
# and backtraces still name file:line, and no debug info for dependencies. Writing and linking
# full debug info was half of every rebuild: Quackify's one-line rebuild went from 16.9 s to
# 8.8 s and its clean build from 87 s to 59 s (measured 08/11/26). Release is untouched.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
